name: u_assistant
description: "U-Assistant — личный помощник: задачи, деньги, заметки. Данные только на устройстве."
publish_to: 'none'
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  core:
    path: ../packages/core
  material_ui: ^1.8.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  drift: ^2.35.3
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  logging: ^1.3.0
  intl: ^0.20.3

flutter:
  uses-material-design: true
  generate: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.16.1
